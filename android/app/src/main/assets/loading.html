<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Mozosubz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#0b1120;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:-apple-system,'DM Sans','Space Grotesk',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;position:relative;
  width:100%;height:100%;
}
.glow{
  position:absolute;top:35%;left:50%;
  transform:translate(-50%,-50%);
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(26,86,219,0.22) 0%,transparent 70%);
  pointer-events:none;
}
.icon-wrap{position:relative;margin-bottom:28px;}
.pulse{
  position:absolute;border-radius:50%;
  animation:pulse-ring 2s ease infinite;
}
.pulse1{inset:-18px;border:1.5px solid rgba(26,86,219,0.3);}
.pulse2{inset:-36px;border:1px solid rgba(26,86,219,0.14);animation-delay:0.4s;}
.name{
  font-size:38px;font-weight:700;color:#fff;
  letter-spacing:-1.5px;margin-bottom:8px;
  animation:fadeUp 0.5s 0.3s ease both;
}
.tagline{
  font-size:14px;color:rgba(255,255,255,0.35);
  font-weight:500;letter-spacing:0.3px;
  animation:fadeUp 0.5s 0.5s ease both;
}
.spinner{margin-top:52px;animation:fadeUp 0.5s 0.7s ease both;}
.dots{
  position:absolute;bottom:56px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:7px;
  animation:fadeUp 0.5s 0.9s ease both;
}
.dot{width:5px;height:5px;border-radius:50%;background:#f97316;}

@keyframes pulse-ring{
  0%,100%{transform:scale(0.92);opacity:0.4;}
  50%{transform:scale(1);opacity:0.85;}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes spin{to{stroke-dashoffset:-251;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>

  <div class="icon-wrap">
    <div class="pulse pulse1"></div>
    <div class="pulse pulse2"></div>
    <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#1e40af"/>
          <stop offset="100%" stop-color="#1a56db"/>
        </linearGradient>
        <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f97316"/>
          <stop offset="100%" stop-color="#fb923c"/>
        </linearGradient>
      </defs>
      <rect width="96" height="96" rx="26" fill="url(#bg)"/>
      <rect x="1" y="1" width="94" height="48" rx="26" fill="white" fill-opacity="0.06"/>
      <rect x="18" y="58" width="8" height="20" rx="3" fill="white" fill-opacity="0.35"/>
      <rect x="30" y="46" width="8" height="32" rx="3" fill="white" fill-opacity="0.55"/>
      <path d="M44 68 L44 36 L57 52 L70 36 L70 68" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M57 24 L51 44 L57.5 44 L50 72" stroke="url(#bolt)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="name">Mozosubz</div>
  <div class="tagline">Instant utility payments</div>

  <div class="spinner">
    <svg width="38" height="38" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="15" stroke="rgba(255,255,255,0.08)" stroke-width="2.5"/>
      <circle cx="18" cy="18" r="15" stroke="url(#sg)" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="40 55" stroke-dashoffset="0"
        style="animation:spin 1.1s linear infinite;transform-origin:18px 18px;"/>
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1a56db"/>
          <stop offset="100%" stop-color="#f97316"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="dots">
    <div class="dot" style="animation:blink 1.4s ease infinite;"></div>
    <div class="dot" style="animation:blink 1.4s 0.2s ease infinite;"></div>
    <div class="dot" style="animation:blink 1.4s 0.4s ease infinite;"></div>
  </div>
</div>
</body>
</html>
