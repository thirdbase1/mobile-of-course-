apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.mozosubz.app"
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.mozosubz.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode project.hasProperty('buildNumber') ? project.buildNumber.toInteger() : 1
        versionName project.hasProperty('buildNumber') ? "1.0.${project.buildNumber}" : "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            def envStorePath     = System.getenv("KEYSTORE_PATH")
            def envStorePassword = System.getenv("KEYSTORE_PASSWORD")
            def envKeyAlias      = System.getenv("KEY_ALIAS")
            def envKeyPassword   = System.getenv("KEY_PASSWORD")
            if (envStorePath && envStorePassword && envKeyAlias && envKeyPassword) {
                storeFile     file(envStorePath)
                storePassword envStorePassword
                keyAlias      envKeyAlias
                keyPassword   envKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def envStorePath     = System.getenv("KEYSTORE_PATH")
            def envStorePassword = System.getenv("KEYSTORE_PASSWORD")
            def envKeyAlias      = System.getenv("KEY_ALIAS")
            def envKeyPassword   = System.getenv("KEY_PASSWORD")
            if (envStorePath && envStorePassword && envKeyAlias && envKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    bundle {
        language {
            enableSplit = true
        }
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Firebase — last version compatible with AGP 8.2.2 / compileSdk 34
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-messaging'

    implementation project(':capacitor-android')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: 'capacitor.build.gradle'
